<line x1="110" y1="135" x2="340" y2="135" stroke="#3F6370" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="225.0" y="116.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">POST /api/certificates/issue</text>
<text x="225.0" y="129.7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">(JWT + form data)</text>
