<text x="392.0" y="449.9" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">Generate PDF with QR code</text>
<line x1="340" y1="487" x2="1010" y2="487" stroke="#3F6370" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="675.0" y="481.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">send email with the PDF (not awaited)</text>
<line x1="340" y1="533" x2="110" y2="533" stroke="#3F6370" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="225.0" y="527.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">201 Created: certificate ID, tx hash</text>
<line x1="110" y1="585" x2="340" y2="585" stroke="#3F6370" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="225.0" y="566.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">GET /api/certificates/:id/pdf</text>
<text x="225.0" y="579.7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">(Bearer token)</text>
<line x1="340" y1="635" x2="110" y2="635" stroke="#3F6370" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="225.0" y="629.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">PDF file</text>
</svg>