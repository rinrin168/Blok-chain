<line x1="800" y1="95" x2="800" y2="735" stroke="#B9B08A" stroke-dasharray="5 4"/>
<rect x="945.0" y="55" width="130" height="40" rx="4" fill="#F3EFE0" stroke="#B9B08A"/>
