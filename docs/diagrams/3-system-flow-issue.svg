<line x1="570" y1="395" x2="340" y2="395" stroke="#3F6370" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="455.0" y="389.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">saved</text>
