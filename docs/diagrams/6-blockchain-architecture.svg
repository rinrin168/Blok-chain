<text x="655.0" y="176.3" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">signed tx</text>
<path d="M780.0,170.0 L780.0,192.5 L870.0,192.5 L870.0,215.0" fill="none" stroke="#3F6370" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="30" y="430" width="300" height="70" rx="6" fill="#FFFFFF" stroke="#577E89" stroke-width="1.5"/>
<text x="180.0" y="455.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">Issue</text>
<text x="180.0" y="468.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">storeCertificate(id, hash) records the hash,</text>
<text x="180.0" y="482.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">the issuing address and the time</text>
<rect x="400" y="430" width="300" height="70" rx="6" fill="#FFFFFF" stroke="#577E89" stroke-width="1.5"/>
<text x="550.0" y="455.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">Revoke</text>
<text x="550.0" y="468.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">revokeCertificate(id) sets isRevoked = true</text>
<text x="550.0" y="482.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">(owner only, cannot be undone)</text>
<rect x="770" y="430" width="300" height="70" rx="6" fill="#FFFFFF" stroke="#577E89" stroke-width="1.5"/>
<text x="920.0" y="455.1" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">Verify</text>
<text x="920.0" y="468.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">backend recomputes the hash and compares it</text>
<text x="920.0" y="482.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">with the on-chain hash and the revoked flag</text>
<text x="30" y="560" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#55696F">Simulation mode (no RPC URL, key or contract address in .env): the same hash is computed, the transaction hash is a mock value and nothing is written on-chain.</text>
