<text x="870.0" y="254.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF">CertificateRegistry (owner = backend wallet)</text>
<text x="870.0" y="268.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF"></text>
<text x="870.0" y="282.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF">mapping(string =&gt; Certificate)</text>
<text x="870.0" y="295.7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF">storeCertificate  revokeCertificate</text>
<text x="870.0" y="309.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF">getCertificate  verifyCertificate</text>
<text x="870.0" y="323.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF">certificateExistsOnChain</text>
