<text x="40" y="127" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">certificateId : string</text>
<text x="40" y="143" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">dataHash : bytes32</text>
<text x="40" y="159" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">issuedBy : address</text>
<text x="40" y="175" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">issuedAt : uint256</text>
<text x="40" y="191" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">isRevoked : bool</text>
<text x="40" y="207" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">exists : bool</text>
<rect x="850" y="80" width="220" height="178" fill="#FFFFFF" stroke="#B9B08A" stroke-width="1.5"/>
<rect x="850" y="80" width="220" height="30" fill="#F3EFE0" stroke="#B9B08A" stroke-width="1.5"/>
<text x="960.0" y="99.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2E33">Events</text>
<text x="860" y="127" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">CertificateIssued(</text>
<text x="860" y="143" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">  certificateId (indexed),</text>
<text x="860" y="159" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">  dataHash,</text>
<text x="860" y="175" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">  issuedBy (indexed),</text>
<text x="860" y="191" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">  issuedAt)</text>
<line x1="850" y1="200" x2="1070" y2="200" stroke="#B9B08A"/>
<text x="860" y="217" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">CertificateRevoked(</text>
<text x="860" y="233" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">  certificateId (indexed),</text>
<text x="860" y="249" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">  revokedAt)</text>
<rect x="30" y="360" width="250" height="88" fill="#FFFFFF" stroke="#577E89" stroke-width="1.5"/>
<rect x="30" y="360" width="250" height="30" fill="#E4EDF0" stroke="#577E89" stroke-width="1.5"/>
<text x="155.0" y="379.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2E33">Modifiers</text>
<text x="40" y="407" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">onlyOwner</text>
<text x="40" y="423" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">certificateExists(id)</text>
<text x="40" y="439" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">certificateNotRevoked(id)</text>
