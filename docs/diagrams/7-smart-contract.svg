<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F6370"/></marker></defs>
<rect width="1100" height="640" fill="#FFFFFF"/>
<text x="24" y="30" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2E33">Figure 7. Smart contract design: CertificateRegistry.sol</text>
<rect x="330" y="60" width="470" height="226" fill="#FFFFFF" stroke="#E1A36F" stroke-width="1.5"/>
<rect x="330" y="60" width="470" height="30" fill="#FBF3E8" stroke="#E1A36F" stroke-width="1.5"/>
<text x="565.0" y="79.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2E33">CertificateRegistry</text>
<text x="340" y="107" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">+ owner : address</text>
<text x="340" y="123" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">+ totalCertificates : uint256</text>
<text x="340" y="139" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">- certificates : mapping(string =&gt; Certificate)</text>
<line x1="330" y1="148" x2="800" y2="148" stroke="#E1A36F"/>
<text x="340" y="165" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">+ storeCertificate(certificateId : string, dataHash : bytes32)</text>
<text x="340" y="181" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">      onlyOwner</text>
<text x="340" y="197" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">+ revokeCertificate(certificateId : string)</text>
<text x="340" y="213" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">      onlyOwner, certificateExists, certificateNotRevoked</text>
<text x="340" y="229" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">+ getCertificate(certificateId : string)</text>
<text x="340" y="245" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">      returns (id, dataHash, issuedBy, issuedAt, isRevoked)</text>
<text x="340" y="261" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">+ certificateExistsOnChain(certificateId : string) : bool</text>
<text x="340" y="277" font-family="Consolas, monospace" font-size="11" fill="#1F2E33">+ verifyCertificate(certificateId : string, dataHash : bytes32) : bool</text>
