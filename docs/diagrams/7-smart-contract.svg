<rect x="279.5" y="164.0" width="76.0" height="18" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="317.5" y="176.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">stores 0..*</text>
<path d="M800.0,173.0 L825.0,173.0 L825.0,169.0 L850.0,169.0" fill="none" stroke="#3F6370" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="792.5" y="164.0" width="40.0" height="18" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="812.5" y="176.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">emits</text>
<path d="M565.0,286.0 L565.0,404.0 L280.0,404.0" fill="none" stroke="#3F6370" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="405.5" y="395.0" width="34.0" height="18" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="422.5" y="407.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">uses</text>
<text x="330" y="430" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1F2E33">Rules enforced on-chain</text>
<text x="330" y="454" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2E33">- Only the owner (the address that deployed the contract) can store or revoke.</text>
<text x="330" y="474" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2E33">- A certificateId can be stored once; storing it again reverts.</text>
<text x="330" y="494" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2E33">- A revoked certificate cannot be revoked again, and verifyCertificate returns false for it.</text>
<text x="330" y="514" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1F2E33">- Reads (getCertificate, verifyCertificate, certificateExistsOnChain) are free view calls.</text>
</svg>