<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F6370"/></marker></defs>
<rect width="1000" height="470" fill="#FFFFFF"/>
<text x="24" y="30" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2E33">Figure 8. Certificate status lifecycle</text>
<rect x="40" y="190" width="40" height="40" rx="20.0" fill="#577E89" stroke="#3F6370" stroke-width="1.5"/>
<text x="60.0" y="214.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF"></text>
<rect x="220" y="170" width="190" height="80" rx="6" fill="#E6F2EA" stroke="#2F7D4F" stroke-width="1.5"/>
<text x="315.0" y="206.7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2E33">ACTIVE</text>
<text x="315.0" y="221.7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2E33">status = active</text>
<rect x="560" y="90" width="190" height="80" rx="6" fill="#F7ECD8" stroke="#A66A12" stroke-width="1.5"/>
<text x="655.0" y="126.7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2E33">EXPIRED</text>
<text x="655.0" y="141.7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2E33">expiryDate has passed</text>
<rect x="560" y="260" width="190" height="80" rx="6" fill="#F6E1DE" stroke="#B3382C" stroke-width="1.5"/>
<text x="655.0" y="296.7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2E33">REVOKED</text>
<text x="655.0" y="311.7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1F2E33">revokedAt + reason stored</text>
<rect x="635" y="375" width="40" height="40" rx="20.0" fill="#577E89" stroke="#3F6370" stroke-width="1.5"/>
<text x="655.0" y="399.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF"></text>
<path d="M80.0,210.0 L220.0,210.0" fill="none" stroke="#3F6370" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="97.0" y="194.0" width="106.0" height="32" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="150.0" y="207.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">issue:</text>
<text x="150.0" y="220.7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">storeCertificate</text>
<path d="M410.0,210.0 L485.0,210.0 L485.0,130.0 L560.0,130.0" fill="none" stroke="#3F6370" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="411.0" y="154.0" width="148.0" height="32" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="485.0" y="167.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">expiry date passes</text>
<text x="485.0" y="180.7" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">(checked on every read)</text>
<path d="M410.0,210.0 L485.0,210.0 L485.0,300.0 L560.0,300.0" fill="none" stroke="#3F6370" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="435.0" y="246.0" width="100.0" height="18" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="485.0" y="258.9" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">revoke by owner</text>
<path d="M750.0,130.0 L810.0,130.0 L810.0,300.0 L750.0,300.0" fill="none" stroke="#3F6370" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="760.0" y="206.0" width="100.0" height="18" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="810.0" y="218.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">revoke by owner</text>
<path d="M655.0,340.0 L655.0,375.0" fill="none" stroke="#3F6370" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="617.0" y="348.5" width="76.0" height="18" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="655.0" y="361.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#1F2E33">end of life</text>
<text x="220" y="440" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#55696F">A certificate with no expiry date stays ACTIVE until it is revoked.</text>
</svg>