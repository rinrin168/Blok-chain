<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - CertChain Organization Portal</title>
  <meta name="description" content="Organization login for CertChain digital certificate platform." />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="icon" type="image/svg+xml" href="./img/logo.svg" />
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="./img/logo.svg" alt="" width="44" height="44" style="margin-bottom:10px" />
      <h1>CertChain</h1>
      <p>Organization sign in</p>
    </div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input id="email" type="email" class="form-control" placeholder="admin@certchain.edu" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input id="password" type="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required />
      </div>

      <div id="error-msg" class="error-box hidden"></div>

      <button id="submit-btn" type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Login</button>
    </form>

    <div class="divider"></div>

    <div style="text-align:center">
      <p style="font-size:13px">
        <a href="./index.html">Back to home</a>
        &nbsp;·&nbsp;
        <a href="./verify.html">Verify a Certificate</a>
      </p>
    </div>

    <div class="demo-note">
      <strong>Demo account</strong><br>
      Email: admin@certchain.edu<br>
      Password: Admin@1234<br>
      <span>Create it first with <code>node backend/scripts/seed.js</code></span>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="./js/app.js"></script>
<script src="./js/auth.js"></script>
</body>
</html>
